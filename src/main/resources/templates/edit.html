<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit User' : 'Add New User'">Add/Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Admin Panel</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white pb-0 border-bottom-0 mt-3">
                    <h3 class="text-center text-secondary" th:text="${isEdit} ? 'Edit User Details' : 'Register New User'"></h3>
                </div>
                <div class="card-body p-4">

                    <form th:action="${isEdit} ? @{/admin/users/{id}(id=${userId})} : @{/admin/users}"
                          th:object="${user}"
                          method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" th:field="*{username}" required placeholder="username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <span th:text="${isEdit} ? 'Password (leave blank to keep current)' : 'Password'"></span>
                            </label>
                            <input type="password" class="form-control" th:field="*{password}"
                                   th:required="${!isEdit}" placeholder="password">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">First Name</label>
                                <!-- th:field automatically wires the input id, name, and value to the User object -->
                                <input type="text" class="form-control" th:field="*{firstName}" required placeholder="John">
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required placeholder="Doe">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}" required placeholder="john.doe@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" th:field="*{age}" required min="1" max="120" placeholder="30">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Roles</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="roles" value="ROLE_USER" id="roleUser"
                                       th:checked="${user.roles != null && user.roles.contains('ROLE_USER')}">
                                <label class="form-check-label" for="roleUser">USER</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="roles" value="ROLE_ADMIN" id="roleAdmin"
                                       th:checked="${user.roles != null && user.roles.contains('ROLE_ADMIN')}">
                                <label class="form-check-label" for="roleAdmin">ADMIN</label>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/admin/users}" class="btn btn-light me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4"
                                    th:text="${isEdit} ? 'Update User' : 'Save User'">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
