<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dynamic Title based on whether the user has an ID -->
    <title th:text="${user.id != null} ? 'Edit User' : 'Add New User'">Add/Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white pb-0 border-bottom-0 mt-3">
                    <h3 class="text-center text-secondary" th:text="${user.id != null} ? 'Edit User Details' : 'Register New User'"></h3>
                </div>
                <div class="card-body p-4">

                    <!--
                      Dynamic Form Action:
                      If user.id exists, POST to /users/{id}
                      If new user, POST to /users
                    -->
                    <form th:action="${user.id != null} ? @{/users/{id}(id=${user.id})} : @{/users}"
                          th:object="${user}"
                          method="post">

                        <!-- Hidden field to retain the ID during updates -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">First Name</label>
                                <!-- th:field automatically wires the input id, name, and value to the User object -->
                                <input type="text" class="form-control" th:field="*{firstName}" required placeholder="John">
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required placeholder="Doe">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}" required placeholder="john.doe@example.com">
                        </div>

                        <div class="mb-4">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" th:field="*{age}" required min="1" max="120" placeholder="30">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/users}" class="btn btn-light me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4"
                                    th:text="${user.id != null} ? 'Update User' : 'Save User'">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
