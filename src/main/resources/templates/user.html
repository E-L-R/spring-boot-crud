<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">User Page</span>
        <div>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-outline-info btn-sm me-2">Admin Panel</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom-0 mt-3">
                    <h3 class="text-center text-secondary">Your Profile</h3>
                </div>
                <div class="card-body p-4">
                    <table class="table">
                        <tbody>
                        <tr>
                            <th class="text-muted">Username</th>
                            <td th:text="${user.username}">username</td>
                        </tr>
                        <tr>
                            <th class="text-muted">First Name</th>
                            <td th:text="${user.firstName}">John</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Last Name</th>
                            <td th:text="${user.lastName}">Doe</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Email</th>
                            <td th:text="${user.email}">john@example.com</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Age</th>
                            <td th:text="${user.age}">30</td>
                        </tr>
                        <tr>
                            <th class="text-muted">Roles</th>
                            <td>
                                <span th:each="role : ${user.roles}" class="badge bg-secondary me-1" th:text="${role.name}">ROLE_USER</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
