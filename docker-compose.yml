version: '3.8'

services:
  # 1. MySQL Database Service
  db:
    image: mysql:9.0
    container_name: mysql-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: user_crud_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Spring MVC Web App Service (Tomcat)
  web:
    build: .
    container_name: spring-mvc-app
    ports:
      - "8080:8080"
    environment:
      # Use 'db' as the hostname because Docker networks resolve service names automatically!
      DB_URL: "jdbc:mysql://db:3306/user_crud_db?serverTimezone=UTC"
      DB_USER: "root"
      DB_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: